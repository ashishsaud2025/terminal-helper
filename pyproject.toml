[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-helper"
version = "0.1.0"
description = "Terminal Helper (th): log shell commands and suggest fixes for typos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
th = "th.cli:main"

[tool.setuptools.packages.find]
include = ["th*"]
